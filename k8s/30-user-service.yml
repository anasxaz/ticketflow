apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: ghcr.io/anasxaz/ticketflow-user-service:latest
          ports:
            - containerPort: 8081
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }
            - { name: CONFIG_SERVER_URL, value: "http://config-server:8888" }
            - { name: EUREKA_INSTANCE_PREFERIPADDRESS, value: "true" }   # piege n.1
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 768Mi }
          startupProbe:                    # laisse le temps a Spring de demarrer
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 5
            failureThreshold: 30           # 30 x 5s = 2min30 max
          livenessProbe:                   # "es-tu vivant ?" sinon -> redemarrage
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
          readinessProbe:                  # "es-tu pret ?" sinon -> pas de trafic
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ticketflow
spec:
  selector: { app: user-service }
  ports:
    - port: 8081