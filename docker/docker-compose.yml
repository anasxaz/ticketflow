#Et maintenant seuls Eureka et la Gateway sont exposés à l'extérieur, les services et les BDs ne le sont pas!      


#Après avoir intégrer OpenFeign, on peut ajouter le config-server dans le docker-compose global pour lancer tous les services en même temps
services:
  # ---------- Bases de données ----------
  user-db:
    image: mariadb:11
    container_name: user-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: user_db
    ports: ["3307:3306"]
    volumes: [user-db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5

  ticket-db:
    image: mariadb:11
    container_name: ticket-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ticket_db
    ports: ["3308:3306"]
    volumes: [ticket-db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5

  # ---------- Infrastructure ----------
  config-server:
    build: ../config-server
    container_name: config-server
    ports: ["8888:8888"]

  discovery-server:
    build: ../discovery-server
    container_name: discovery-server
    ports: ["8761:8761"]
    
  kafka:
    image: apache/kafka:3.9.0
    container_name: tf-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: tf-kafka-ui
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: ticketflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]
  
  # ---------- Services ----------
  user-service:
    build: ../user-service
    container_name: user-service
    environment: &client-env         
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    restart: on-failure
    depends_on:
      user-db: { condition: service_healthy }
      config-server: { condition: service_started }
      discovery-server: { condition: service_started }

  ticket-service:
    build: ../ticket-service
    container_name: ticket-service
    environment: *client-env         
    restart: on-failure
    depends_on:
      ticket-db: { condition: service_healthy }
      config-server: { condition: service_started }
      discovery-server: { condition: service_started }

  api-gateway:
    build: ../api-gateway
    container_name: api-gateway
    ports: ["8087:8087"]
    environment: *client-env       
    restart: on-failure
    depends_on: [config-server, discovery-server, user-service, ticket-service]

volumes:
  user-db-data:
  ticket-db-data: