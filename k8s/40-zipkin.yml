apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: zipkin }
  template:
    metadata:
      labels: { app: zipkin }
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          ports:
            - containerPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: ticketflow
spec:
  type: LoadBalancer            # interne (zipkin:9411) ET externe (localhost:9411)
  selector: { app: zipkin }
  ports:
    - port: 9411