<header>
  <strong>🎫 TicketFlow</strong>
  <span>Connecté : {{ auth.username }} ({{ auth.roles.join(', ') }})</span>
  <button (click)="auth.logout()">Se déconnecter</button>
</header>

<main>
  <button (click)="loadNotifications()">Tester l'API : mes notifications</button>

  @if (notifications(); as list) {
    <p>✅ {{ list.length }} notification(s) reçue(s) via la Gateway</p>
  }
  @if (error()) {
    <p>❌ Erreur : {{ error() }}</p>
  }
</main>

<router-outlet />
