server.port=8084
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=workflow-service
spring.kafka.consumer.auto-offset-reset=latest

camunda.client.mode=self-managed
camunda.client.auth.method=none
camunda.client.rest-address=http://localhost:8088
camunda.client.grpc-address=http://localhost:26500

# SLA par priorite (valeurs DEMO ; en reel : CRITICAL=PT2H, HIGH=PT4H, MEDIUM=PT24H, LOW=PT72H)
ticketflow.sla.CRITICAL=PT1M
ticketflow.sla.HIGH=PT2M
ticketflow.sla.MEDIUM=PT5M
ticketflow.sla.LOW=PT10M