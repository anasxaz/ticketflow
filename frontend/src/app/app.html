<header class="topbar">
  <a class="brand gradient-text" routerLink="/">TicketFlow</a>

  <nav class="nav">
    @if (auth.hasRole('CLIENT')) {
      <a class="pill" routerLink="/client/new" routerLinkActive="active">Nouveau ticket</a>
      <a class="pill violet" routerLink="/client/tickets" routerLinkActive="active">Mes tickets</a>
      <a class="pill purple" routerLink="/client/notifications" routerLinkActive="active">Notifications</a>
    }
    @if (auth.hasRole('AGENT')) {
      <a class="pill violet" routerLink="/agent" routerLinkActive="active">Tickets</a>
    }
  </nav>

  <span class="spacer"></span>
  <span class="user">{{ auth.username }}</span>
  <button class="pill red" (click)="auth.logout()">Se déconnecter</button>
</header>
<div class="gradient-line"></div>

<main class="container">
  <router-outlet />
</main>
