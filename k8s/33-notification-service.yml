apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/anasxaz/ticketflow-notification-service:latest
          ports:
            - containerPort: 8083
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }
            - { name: CONFIG_SERVER_URL, value: "http://config-server:8888" }
            - { name: EUREKA_INSTANCE_PREFERIPADDRESS, value: "true" }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 768Mi }
          readinessProbe:                # tcp : ce service n'a pas forcement actuator
            tcpSocket: { port: 8083 }
            initialDelaySeconds: 40
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ticketflow
spec:
  selector: { app: notification-service }
  ports:
    - port: 8083