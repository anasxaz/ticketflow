apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-db-data
  namespace: ticketflow
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-db
  namespace: ticketflow
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels: { app: notification-db }
  template:
    metadata:
      labels: { app: notification-db }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: notification_db
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mariadb-secret, key: root-password }   # lu depuis le Secret
          readinessProbe:
            exec:
              command: [ "healthcheck.sh", "--connect", "--innodb_initialized" ]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notification-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: notification-db                # <- MEME nom que dans le compose
  namespace: ticketflow
spec:
  selector: { app: notification-db }   # envoie le trafic aux pods qui ont ce label
  ports:
    - port: 3306