apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-server }
  template:
    metadata:
      labels: { app: config-server }
    spec:
      containers:
        - name: config-server
          image: ghcr.io/anasxaz/ticketflow-config-server:latest
          ports:
            - containerPort: 8888
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: native }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 8888 }
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: ticketflow
spec:
  selector: { app: config-server }
  ports:
    - port: 8888