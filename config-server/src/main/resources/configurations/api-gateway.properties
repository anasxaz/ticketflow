server.port=8087
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webmvc.routes[1].id=ticket-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ticket-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/tickets/**
spring.cloud.gateway.server.webmvc.routes[2].id=notification-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/notifications/**
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/ticketflow/protocol/openid-connect/certs