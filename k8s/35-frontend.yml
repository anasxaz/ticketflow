apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/anasxaz/ticketflow-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { memory: 32Mi, cpu: 20m }
            limits:   { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ticketflow
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - port: 4200          # meme adresse qu'en dev -> aucun changement dans Keycloak
      targetPort: 80