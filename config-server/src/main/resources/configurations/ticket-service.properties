server.port=8082
spring.datasource.url=jdbc:mariadb://localhost:3308/ticket_db
spring.datasource.username=root
spring.datasource.password=root

spring.kafka.bootstrap-servers=localhost:9092


# --- Resilience4j : circuit breaker sur Feign ---
spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$FeignClientException

resilience4j.timelimiter.configs.default.timeout-duration=3s

# --- Actuator : voir l'état du disjoncteur ---
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# LLM (Groq, API compatible OpenAI) - la cle vient d'une variable d'environnement, JAMAIS de Git
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:missing}
spring.ai.openai.chat.model=llama-3.3-70b-versatile
spring.ai.openai.chat.temperature=0

ticketflow.triage.confidence-threshold=0.7
resilience4j.timelimiter.instances.llm.timeout-duration=5s



