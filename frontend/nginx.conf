server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels API sont relayes vers la Gateway (nom du Service Kubernetes)
    location /api/ {
        proxy_pass http://api-gateway:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA : toute URL inconnue (/client/tickets, /agent...) renvoie index.html, Angular gere la route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
