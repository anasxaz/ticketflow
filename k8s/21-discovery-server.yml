apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: discovery-server }
  template:
    metadata:
      labels: { app: discovery-server }
    spec:
      containers:
        - name: discovery-server
          image: ghcr.io/anasxaz/ticketflow-discovery-server:latest
          ports:
            - containerPort: 8761
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 8761 }
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: ticketflow
spec:
  selector: { app: discovery-server }
  ports:
    - port: 8761