name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false              # un service qui échoue n'arrête pas les autres
      matrix:
        include:
          - { service: config-server,        tests: false }
          - { service: discovery-server,     tests: false }
          - { service: api-gateway,          tests: false }
          - { service: user-service,         tests: false }
          - { service: ticket-service,       tests: true  }
          - { service: notification-service, tests: true  }
          - { service: workflow-service,     tests: false }

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven                                   # cache des dépendances Maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw                               # Windows ne garde pas ce droit

      - name: Build + tests d'intégration (Testcontainers)
        if: matrix.tests
        run: ./mvnw -B verify

      - name: Build (sans tests)
        if: ${{ !matrix.tests }}
        run: ./mvnw -B package -DskipTests