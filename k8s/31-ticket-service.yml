apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: ticketflow
spec:
  replicas: 2   # 2 instances pour que la Gateway répartir la charge si je me rappelle via un Load Balancer
  selector:
    matchLabels: { app: ticket-service }
  template:
    metadata:
      labels: { app: ticket-service }
    spec:
      containers:
        - name: ticket-service
          image: ghcr.io/anasxaz/ticketflow-ticket-service:latest
          ports:
            - containerPort: 8082
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }
            - { name: CONFIG_SERVER_URL, value: "http://config-server:8888" }
            - { name: EUREKA_INSTANCE_PREFERIPADDRESS, value: "true" }   # piege n.1
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: { name: groq-secret, key: api-key }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 768Mi }
          startupProbe:                    # laisse le temps a Spring de demarrer
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 5
            failureThreshold: 30           # 30 x 5s = 2min30 max
          livenessProbe:                   # "es-tu vivant ?" sinon -> redemarrage
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 10
          readinessProbe:                  # "es-tu pret ?" sinon -> pas de trafic
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: ticketflow
spec:
  selector: { app: ticket-service }
  ports:
    - port: 8082