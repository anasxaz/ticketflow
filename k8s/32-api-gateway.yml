apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/anasxaz/ticketflow-api-gateway:latest
          ports:
            - containerPort: 8087
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: docker }
            - { name: CONFIG_SERVER_URL, value: "http://config-server:8888" }
            - { name: EUREKA_INSTANCE_PREFERIPADDRESS, value: "true" }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8087 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ticketflow
spec:
  type: LoadBalancer          # accessible sur localhost:8087
  selector: { app: api-gateway }
  ports:
    - port: 8087